#name=雅迪App打开时捕获H5 Token
#desc=v1.6: 脚本URL带?v=15强制刷新QX脚本缓存；存储API修复为$prefs(QX)；token变化弹通知。更新片段后重开雅迪App即可捕获
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Power.png

# MitM 主机白名单（如已开启 MITM，把该域名追加到现有 hostname 行）
hostname = tspapph5.yadeaiot.com.cn

# 正式规则：H5 网关接口，请求+响应双阶段捕获（NE v1.7.0 request-header 可能无 $request，双保险）
^https?:\/\/tspapph5\.yadeaiot\.com\.cn\/prod-wg\/api\/app\/ url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/Yadea_TokenCapture.js?v=15
^https?:\/\/tspapph5\.yadeaiot\.com\.cn\/prod-wg\/api\/app\/ url script-response-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/Yadea_TokenCapture.js?v=15

# 诊断规则（v1.4）：全站任意路径，用于定位"重写不触发"是 MITM 问题还是路径问题
# Safari 打开 https://tspapph5.yadeaiot.com.cn/ 后到 QX 日志找 [YadeaToken] 行
^https?:\/\/tspapph5\.yadeaiot\.com\.cn\/ url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/Yadea_TokenCapture.js?v=15
^https?:\/\/tspapph5\.yadeaiot\.com\.cn\/ url script-response-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/Yadea_TokenCapture.js?v=15
