#name=雅迪App打开时捕获H5 Token
#desc=v1.0: 捕获 tspapph5 网关请求头 Authorization(Bearer JWT)，变化时弹通知(详情页可复制)；搭配 Scriptable「Yadea Car」组件使用，token 有效期约 1 年，App 重新登录后重开 App 即可重新捕获
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Power.png

# MitM 主机白名单（如已开启 MITM，把该域名追加到现有 hostname 行）
hostname = tspapph5.yadeaiot.com.cn

# 车辆状态 / 绑定列表等 H5 网关接口：仅捕获请求头，不改动请求
^https?:\/\/tspapph5\.yadeaiot\.com\.cn\/prod-wg\/api\/app\/ url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/Yadea_TokenCapture.js
