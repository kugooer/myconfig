#name=雅迪App打开时捕获H5 Token
#desc=v1.4: 捕获 tspapph5 请求头 Authorization(Bearer JWT)，变化时弹通知；双类型+全站诊断规则(仅日志不通知)；Safari 打开 https://tspapph5.yadeaiot.com.cn 若弹证书警告=证书未信任；搭配 Scriptable「Yadea Car」组件
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Power.png

# MitM 主机白名单（如已开启 MITM，把该域名追加到现有 hostname 行）
hostname = tspapph5.yadeaiot.com.cn

# 正式规则：H5 网关接口，请求+响应双阶段捕获（NE v1.7.0 request-header 可能无 $request，双保险）
^https?:\/\/tspapph5\.yadeaiot\.com\.cn\/prod-wg\/api\/app\/ url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/Yadea_TokenCapture.js
^https?:\/\/tspapph5\.yadeaiot\.com\.cn\/prod-wg\/api\/app\/ url script-response-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/Yadea_TokenCapture.js

# 诊断规则（v1.4）：全站任意路径，用于定位"重写不触发"是 MITM 问题还是路径问题
# Safari 打开 https://tspapph5.yadeaiot.com.cn/ 后到 QX 日志找 [YadeaToken] 行
^https?:\/\/tspapph5\.yadeaiot\.com\.cn\/ url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/Yadea_TokenCapture.js
^https?:\/\/tspapph5\.yadeaiot\.com\.cn\/ url script-response-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/Yadea_TokenCapture.js
