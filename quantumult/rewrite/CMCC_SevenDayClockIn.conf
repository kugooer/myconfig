#name=中国移动 7日打卡分百万
#desc=「7日打卡分百万」自动打卡 capture-v1：仅 MitM dev.coc.10086.cn。抓取 User-Token 与打卡密文载荷，定时任务查状态后自动补打卡；已签静默不推送。脚本走 jsDelivr 镜像（raw 不稳）。
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China_Mobile.png

hostname = dev.coc.10086.cn

# ========== 打卡写请求：body 是 AES-GCM 密文，必须用 script-request-body ==========
# 抓到 (cocEnContent + coc-aurora) 作为设备级冻结载荷，供定时任务重放
^https:\/\/dev\.coc\.10086\.cn\/coc\/activities\/prize\/clockIn url script-request-body https://cdn.jsdelivr.net/gh/kugooer/myconfig@main/quantumult/scripts/CMCC_SevenDayClockIn.js

# ========== 状态查询：每次打开活动页都会调用，用于刷新 User-Token ==========
# 接口为明文 JSON，只需 Cookie: User-Token
^https:\/\/dev\.coc\.10086\.cn\/coc\/activities\/prize\/consecutiveClockInQuery url script-request-header https://cdn.jsdelivr.net/gh/kugooer/myconfig@main/quantumult/scripts/CMCC_SevenDayClockIn.js
