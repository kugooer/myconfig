#name=中国移动 7日打卡分百万
#desc=「7日打卡分百万」capture-v3：仅 MitM dev.coc.10086.cn。抓取 User-Token 与冻结载荷做诊断；冻结载荷实测一次性、无法代打。配套定时任务做「漏签检查」——今日未签才提醒，已签/过期静默。打卡本体 = 打开 7 日页。
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China_Mobile.png

hostname = dev.coc.10086.cn

# ========== 主触发：loginCheck 换令牌 ==========
# 响应是明文 JSON（{"data":{"token":"000_<32hex>"}}），直接读出入库（Token 仅 30 分钟有效）。
# capture-v3 默认不再注入代打（冻结载荷一次性，复用一律 code 10），仅抓凭证 + 漏签检查。
^https:\/\/dev\.coc\.10086\.cn\/coc\/user\/loginCheck url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_SevenDayClockIn.js

# ========== 打卡写请求：body 是 AES-GCM 密文，必须用 script-request-body ==========
# 抓到 (cocEnContent + coc-aurora) 作为冻结载荷。实测一次性：页面真实打卡时被消费，
# 之后任何账号重放均返回 code 10（服务端能解密但业务层拒绝），仅留作诊断。
^https:\/\/dev\.coc\.10086\.cn\/coc\/activities\/prize\/clockIn url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_SevenDayClockIn.js

# ========== 状态查询：每次打开 7 日页都会调用，顺带刷新 Cookie 里的 User-Token ==========
# 接口为明文 JSON，只需 Cookie: User-Token
^https:\/\/dev\.coc\.10086\.cn\/coc\/activities\/prize\/consecutiveClockInQuery url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_SevenDayClockIn.js
