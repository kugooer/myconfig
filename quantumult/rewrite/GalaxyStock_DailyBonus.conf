#name=银河证券登录后自动签到
#desc=capture-v1.5-诊断: hostname临时扩至*.chinastock.com.cn全域, 打印命中URL/SESSION有无, 定位登录后可触发域; 确认后收窄
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Calendar.png

# 【临时诊断】hostname 全域（v1.5）：定位登录后可触发的凭证源
# 注意：确认触发域后必须收窄回单一域，避免全域 MitM 拖慢 App
hostname = *.chinastock.com.cn

# 诊断规则：整个 chinastock 域触发，脚本打印 URL/SESSION 有无（不阻塞原请求）
# 若发现带 SESSION 的非 mall 域请求 → 下一版据此收窄并设为正式触发点
^https?:\/\/.*chinastock\.com\.cn\/.* url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/GalaxyStock_DailyBonus.js
