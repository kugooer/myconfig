#name=银河证券登录后自动签到
#desc=capture-v1.4: 触发面扩至整个mall网关, 登录流程走h5_gateway即自动触发签到；带SESSION才签, 无则放行
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Calendar.png

# MitM 主机白名单（最小化；仅 H5 网关域）
hostname = mall.chinastock.com.cn

# 触发面：整个 mall H5 网关域（v1.4 扩展）。
# 登录流程若走 h5_gateway（H5 登录页/登录后初始化）→ 登录完成即触发脚本；
# 进「智能VIP/VIP中心」H5 同样命中（原有 vip 路径已被本规则覆盖）。
# 脚本内判定：请求头带 SESSION 且同日未签才签到；无 SESSION 直接放行。
# 使用 script-request-header 即可（SESSION 在请求头，无需 body）
^https:\/\/mall\.chinastock\.com\.cn\/h5_gateway\/.* url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/GalaxyStock_DailyBonus.js
