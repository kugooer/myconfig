# MitM 主机白名单（收窄回 mall 网关域）
hostname = mall.chinastock.com.cn

# 触发面：mall H5 网关域（进「智能VIP/VIP中心」H5 时命中 → 抓凭证 + 自动签到）
# 脚本内判定：请求头带 SESSION 且同日未签才签到；无 SESSION 直接放行
# 使用 script-request-header 即可（SESSION 在请求头，无需 body）
^https:\/\/mall\.chinastock\.com\.cn\/h5_gateway\/.* url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/GalaxyStock_DailyBonus.js
