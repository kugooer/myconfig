# MitM 主机白名单（最小化；仅 H5 网关域）
hostname = mall.chinastock.com.cn

# 打开 App 后 H5 自动请求 vip 系列接口（带 SESSION）→ 抓凭证 + 延时自动签到
# 使用 script-request-header 即可（SESSION 在请求头，无需 body）
^https:\/\/mall\.chinastock\.com\.cn\/h5_gateway\/smart-trade\/vip\/.* url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/GalaxyStock_DailyBonus.js
