#name=比亚迪App登录后自动签到
#desc=用户登录后打开积分/签到页自动抓取加密request，定时任务自动签到。非会员解锁类脚本。
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Calendar.png

# 仅签到业务相关 hostname
hostname = dilinkappserver-cn.byd.auto, dilinksuperappserver-cn.byd.auto, dilinkappserver.byd.auto

# 打开积分商城/签到时抓取 Sign.signIn 请求体（加密 request）
^https:\/\/dilink(super)?appserver(-cn)?\.byd\.auto\/.*Sign\.signIn url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
