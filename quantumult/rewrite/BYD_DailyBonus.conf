#name=比亚迪App登录后自动签到
#desc=只抓 Sign.signIn/积分商城 club 请求。不会保存车况/控件 request（避免误抓）。
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Calendar.png

# 注意：不要 MITM dilinksuperappserver（车况/远程控制），否则易误抓与网络异常
# 签到接口通常在 dilinkappserver-cn.byd.auto 的 /club/
hostname = dilinkappserver-cn.byd.auto, dilinkappserver.byd.auto, dilinkappserver.bydauto.com.cn

# 仅签到/积分
^https:\/\/dilinkappserver[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/club\/ url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
^https:\/\/dilinkappserver[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/[^\s]*Sign\.signIn url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
^https:\/\/dilinkappserver[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/[^\s]*integralMall url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
^https:\/\/dilinkappserver[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/[^\s]*serviceDir=Sign url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
