#name=比亚迪App登录后自动签到
#desc=仅拦截签到相关请求抓凭证；不接管全站 dilink，避免 App 报网络错误。
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Calendar.png

# 仅签到/积分相关主机（勿扩 mina.byd.com，易导致 App 全站异常）
hostname = dilinkappserver-cn.byd.auto, dilinksuperappserver-cn.byd.auto, dilinkappserver.byd.auto, dilinkappserver.bydauto.com.cn

# 仅匹配签到/积分商城接口（script-request-body 必须放行原请求）
^https:\/\/dilink[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/club\/\?[^\s]*serviceDir=Sign\.signIn url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
^https:\/\/dilink[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/club\/\?[^\s]*Sign\.signIn url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
^https:\/\/dilink[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/club\/\?[^\s]*integralMall url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
^https:\/\/dilink[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/[^\s]*Sign\.signIn url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
