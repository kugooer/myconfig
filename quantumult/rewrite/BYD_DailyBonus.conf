#name=比亚迪App登录后自动签到
#desc=capture-v5: 拦截 dilinkappserver/club 抓签到 request；诊断 mina 网关。不抓车况 superappserver。
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Calendar.png

# 签到接口：dilinkappserver-cn.byd.auto/club/...
# 诊断接口：mina.byd.com 统一网关（仅写诊断，不入库）
# 勿 MITM dilinksuperappserver（车况/控件，无效且易网络错误）
hostname = dilinkappserver-cn.byd.auto, dilinkappserver.byd.auto, dilinkappserver.bydauto.com.cn, mina.byd.com

# 优先：积分商城 / 签到明确路径
^https:\/\/dilinkappserver[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/club\/ url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
^https:\/\/dilinkappserver[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/[^\s]*(?:Sign\.signIn|serviceDir=Sign|integralMall) url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js

# 兜底：dilinkappserver 所有 POST body（只在 body 含 request 且 URL 非车况时才可能入库）
^https:\/\/dilinkappserver[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/ url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js

# 诊断：mina 统一网关（二进制/protobuf，仅记 Operation-Type，不入库）
^https:\/\/mina\.byd\.com(?::\d+)?\/mgw\.htm url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
