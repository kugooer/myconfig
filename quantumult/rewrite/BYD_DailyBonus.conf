#name=比亚迪App登录后自动签到
#desc=登录后打开积分/签到页自动抓凭证；定时任务自动签到。未抓到凭证时请看脚本日志中的抓包诊断。
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Calendar.png

# MITM：务必开启 HTTPS 解密，并确保下列域名未被排除
hostname = dilinkappserver-cn.byd.auto, dilinksuperappserver-cn.byd.auto, dilinkappserver.byd.auto, dilinkappserver.bydauto.com.cn, dilink.byd.auto, mina.byd.com

# 签到接口（主力）
^https:\/\/dilink[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/.*Sign\.signIn url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
^https:\/\/dilink[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/club\/\?.*serviceDir=Sign url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
^https:\/\/dilink[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/club\/ url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js

# 积分商城转发（兼容不同 serviceDir）
^https:\/\/dilink[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/.*integralMall url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
^https:\/\/dilink[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/.*[Ss]ign[Ii]n url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js

# 诊断：凡带 JSON body 的 dilink 请求也进脚本（仅记录/有 request 才存）
^https:\/\/dilink[^\/]*\.byd(?:auto)?\.(?:auto|com\.cn)\/ url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYD_DailyBonus.js
