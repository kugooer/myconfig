#desc=无忧行签到 capture-v1.2：移除 app3（电话服务器冲突）；MitM 仅 app.jegotrip.com.cn
# 脚本: https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/JegoTrip_DailyBonus.js

# 重要：不要加入 app3.jegotrip.com.cn
# 该域名承载无忧行电话/呼叫服务，一旦被 QX 接管(MitM/隧道)会导致"无法连接电话服务器"。
# 签到接口实测全部走 app.jegotrip.com.cn，移除 app3 不影响签到。
hostname = app.jegotrip.com.cn

# 抓取带 token 的任务/签到接口（request-header 足够，token 在 URL）
^https:\/\/app\.jegotrip\.com\.cn\/api\/service\/(v1\/mission|member\/v1|user\/v1)\/ url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/JegoTrip_DailyBonus.js
