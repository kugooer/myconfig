#desc=capture-v2: 修复 QX rewrite 正则完整匹配失败（URL 尾部 &serviceDir= 导致旧规则永不触发）, 放宽为域级匹配
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Calendar.png

# MitM 最小白名单：仅小程序业务网关域。
# 注意：手机微信打开比亚迪小程序（wxf62054ec313d6f53）任意页面即触发捕获。
hostname = mina.bydoceanauto.com

# 捕获 session_id：需要请求体（加密），必须用 script-request-body
# QX url 正则为完整匹配：真实 URL 形如 ?service=Forward2Rights.task&serviceDir=...，
# 尾部必须通配，否则永不命中；脚本内已做 session_id 过滤，域级匹配安全
^https?:\/\/mina\.bydoceanauto\.com(?::\d+)?(?:\/|\?|$)[\s\S]*$ url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/BYDMina_DailyBonus.js
