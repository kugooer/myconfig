#name=中国移动登录后即时签到
#desc=签到领奖(qwhdhub/domark)+打开移动云盘 getUser 即自签(querySpec→tyrz→startSignIn，每日一次)。云盘仅 hook getUser/startSignIn，避免自签 HTTP 嵌套 rewrite。
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China_Mobile.png

# 仅必要 hostname（勿写 *.yun.139.com 全站 MITM）
hostname = client.app.coc.10086.cn, clientaccess.10086.cn, wx.10086.cn, m.mcloud.139.com, user-njs.yun.139.com, user.yun.139.com

# ========== 中国移动 App：登录 / 会话 ==========
^https:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/LN\/uamrandcodelogin\/fingerprintLogin url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# 仅业务域会话刷新（不要匹配静态/无关子路径时另加；保持单条 request）
^https:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/ url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# ========== 签到领奖 H5 ==========
^https:\/\/wx\.10086\.cn\/qwhdsso\/appTokenLogin url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
^https:\/\/wx\.10086\.cn\/qwhdsso\/appTokenLogin url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
^https:\/\/wx\.10086\.cn\/qwhdhub\/qwhdmark\/ url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
^https:\/\/wx\.10086\.cn\/qwhdhub\/api\/mark\/mark31\/(domark|markstatus|taskAward) url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
^https:\/\/wx\.10086\.cn\/qwhdhub\/api\/mark\/mark31\/(domark|markstatus|taskAward) url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# ========== 移动云盘：打开即签 ==========
# 主触发：getUser 的 request + response（仅 Basic 触发；脚本自签不 hook querySpec/tyrz）
^https:\/\/user(?:-njs)?\.yun\.139\.com\/user\/getUser url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
^https:\/\/user(?:-njs)?\.yun\.139\.com\/user\/getUser url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
# App 自己签到时的结果观测（可选；不挂 request）
^https:\/\/m\.mcloud\.139\.com\/ycloud\/signin\/page\/startSignIn url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
