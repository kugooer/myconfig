#name=中国移动登录后即时签到
#desc=参考 NobyDa 多账号结构：登录成功后用本次会话动态签到，不固化历史 body。含会话捕获/云盘凭证/H5签到接口学习/定时任务。
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China_Mobile.png

hostname = client.app.coc.10086.cn, clientaccess.10086.cn, caiyun.feixin.10086.cn, orches.yun.139.com, vsbo.caiyun.feixin.10086.cn, note.mcloud.139.com, yun.139.com, touch.10086.cn, wx.10086.cn, h.app.coc.10086.cn, m.client.10086.cn, *.10086.cn

# 登录成功：捕获 JSESSIONID/UID/x-token → 即时动态签到
^https:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/LN\/uamrandcodelogin\/fingerprintLogin url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# App 会话刷新：更新 cookie / x-token
^https:\/\/(client\.app\.coc\.10086\.cn|clientaccess\.10086\.cn)\/ url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# 云盘/笔记鉴权：捕获 Authorization → 云盘动态签到
^https:\/\/(vsbo\.caiyun\.feixin\.10086\.cn|note\.mcloud\.139\.com|orches\.yun\.139\.com|caiyun\.feixin\.10086\.cn) url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# H5/疑似签到接口：自动学习明文模板（只学结构，不固化 body）
^https:\/\/[^\/]*10086\.cn\/.*(sign|signin|signIn|doSign|checkIn|checkin|qiandao) url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
^https:\/\/(touch|wx|h\.app\.coc|m\.client)\.10086\.cn\/ url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
