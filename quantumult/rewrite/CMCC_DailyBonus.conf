#name=中国移动登录后即时签到
#desc=登录后走 qwhdsso→QWHD_SESSION_TOKEN→mark31/domark 动态签到。不回放历史 body。
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China_Mobile.png

hostname = client.app.coc.10086.cn, clientaccess.10086.cn, caiyun.feixin.10086.cn, orches.yun.139.com, vsbo.caiyun.feixin.10086.cn, note.mcloud.139.com, yun.139.com, wx.10086.cn, touch.10086.cn, h.app.coc.10086.cn, m.client.10086.cn, *.10086.cn

# 登录成功：捕获 JSESSIONID/UID → 即时动态签到（主路径 qwhdhub）
^https:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/LN\/uamrandcodelogin\/fingerprintLogin url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# App 会话刷新
^https:\/\/(client\.app\.coc\.10086\.cn|clientaccess\.10086\.cn)\/ url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# 云盘鉴权（辅路径）
^https:\/\/(vsbo\.caiyun\.feixin\.10086\.cn|note\.mcloud\.139\.com|orches\.yun\.139\.com|caiyun\.feixin\.10086\.cn) url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# H5 SSO：捕获 appTokenLogin 请求/响应（sid、jwt、token）
^https:\/\/wx\.10086\.cn\/qwhdsso\/appTokenLogin url script-request-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
^https:\/\/wx\.10086\.cn\/qwhdsso\/appTokenLogin url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# 签到页落地：捕获 QWHD_SESSION_TOKEN
^https:\/\/wx\.10086\.cn\/qwhdhub\/qwhdmark\/ url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# 签到 H5 业务 API：保存会话 + 学习 domark
^https:\/\/wx\.10086\.cn\/qwhdhub\/api\/ url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
^https:\/\/wx\.10086\.cn\/qwhdhub\/api\/ url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js

# 仅动作类签到接口学习（domark/doMark/doSign/signin/checkIn/taskAward）
^https:\/\/[^\/]*10086\.cn\/.*(domark|doMark|doSign|signin|signIn|checkIn|checkin|taskAward|receiveMark|dailySign) url script-response-body https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/CMCC_DailyBonus.js
