#name=联通App登录后自动签到
#desc=capture-v1: activity.10010.com 签到页 Cookie 抓取(路线A, 明文Cookie认证); 打开联通App首页即自动抓取
#author=WorkBuddy
#homepage=https://github.com/kugooer/myconfig
#icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Calendar.png

# MitM 最小化: 仅签到活动主机; 不要加 m.client.10010.com 等无关域
hostname = activity.10010.com

# 签到页/月签/任务接口 (header-only 即可拿到完整 Cookie; 正则与脚本 CAPTURE_RE 同步)
^https:\/\/activity\.10010\.com\/sixPalaceGridTurntableLottery\/(?:signin\/|task\/|floor\/getMonthSign) url script-request-header https://raw.githubusercontent.com/kugooer/myconfig/main/quantumult/scripts/Unicom_DailyBonus.js
